services:
  postgres:
    image: postgres:16-alpine
    container_name: inventario-postgres
    environment:
      POSTGRES_USER: equipos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: equipos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    environment:
      DATABASE_URL: postgresql://equipos:password123@postgres:5432/equipos_db
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: inventario-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped

volumes:
  postgres_data:
